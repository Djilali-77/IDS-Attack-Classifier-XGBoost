version: '3.8'

services:
  backend:
    build: ./backend
    ports: 
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # Optional: Good practice for Python apps
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume for node_modules to prevent local host overwriting it
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
